name: shinkansen-status
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shinkansen-status
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: get previous status (for inheritance on transient failures)
        run: |
          curl -sf --max-time 20 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/status/shinkansen_status.json" \
            -o shinkansen_status.json || true
      - name: fetch status
        run: python3 scripts/fetch_shinkansen_status.py
        env:
          ODPT_CHALLENGE_TOKEN: ${{ secrets.ODPT_CHALLENGE_TOKEN }}
      - name: fetch weather warnings
        run: python3 scripts/fetch_weather_warnings.py || true
      - name: fetch zairaisen status
        run: python3 scripts/fetch_zairaisen_status.py || true
        env:
          ODPT_TOKEN: ${{ secrets.ODPT_TOKEN }}
          ODPT_CHALLENGE_TOKEN: ${{ secrets.ODPT_CHALLENGE_TOKEN }}
      - name: fetch pressure grid (hourly, skip if fresh)
        run: |
          curl -sf --max-time 20 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/status/pressure_grid.json" \
            -o pressure_grid.json || true
          python3 scripts/fetch_pressure_grid.py || true
      - name: fetch highway events (skip if fresh)
        run: |
          curl -sf --max-time 20 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/status/highway_events.json" \
            -o highway_events.json || true
          python3 scripts/fetch_highway_events.py || true
      - name: push to status branch
        run: |
          mkdir -p /tmp/out && cp shinkansen_status.json /tmp/out/
          [ -s weather_warnings.json ] && cp weather_warnings.json /tmp/out/ || true
          [ -s zairaisen_status.json ] && cp zairaisen_status.json /tmp/out/ || true
          [ -s pressure_grid.json ] && cp pressure_grid.json /tmp/out/ || true
          [ -s highway_events.json ] && cp highway_events.json /tmp/out/ || true
          cd /tmp/out
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "update shinkansen status"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
