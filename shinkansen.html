<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新幹線運行マップ（2D軽量版）｜日本ライブマップ</title>
<meta name="description" content="全国の新幹線10路線の経路と現在の運行状況（平常・遅れ・運転見合わせ）を日本地図上に表示します。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #0e1116; --panel: rgba(17, 22, 30, .92); --border: #2a3342;
    --text: #e6edf3; --muted: #8b98a9;
    --c-normal: #2ecc71; --c-info: #f1c40f; --c-delay: #f39c12;
    --c-suspend: #e74c3c; --c-unknown: #7f8c9b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  #map { position: absolute; inset: 0; background: #0e1116; }
  .leaflet-container { font: inherit; }

  #panel { position: absolute; top: 10px; right: 10px; z-index: 1000;
    width: 300px; max-height: calc(100% - 20px); display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(6px); box-shadow: 0 4px 24px rgba(0,0,0,.5); overflow: hidden; }
  #panel header { padding: 10px 14px 8px; border-bottom: 1px solid var(--border); }
  #panel h1 { margin: 0; font-size: 15px; letter-spacing: .04em; }
  #panel h1 .em { color: #6ec6ff; }
  #updated { font-size: 11px; color: var(--muted); margin-top: 3px; }
  #updated .err { color: var(--c-delay); }
  #lines { overflow-y: auto; padding: 6px 0; flex: 1; }
  .line-row { display: flex; align-items: flex-start; gap: 9px; padding: 7px 14px;
    cursor: pointer; border-left: 3px solid transparent; }
  .line-row:hover { background: rgba(255,255,255,.05); border-left-color: #6ec6ff; }
  .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 3px; flex: none;
    box-shadow: 0 0 6px currentColor; }
  .line-name { font-size: 13px; font-weight: 600; }
  .line-name small { color: var(--muted); font-weight: 400; margin-left: 5px; font-size: 10px; }
  .line-status { font-size: 11.5px; margin-top: 1px; }
  .line-detail { font-size: 10.5px; color: var(--muted); margin-top: 1px;
    line-height: 1.35; word-break: break-all; }
  .line-notice { font-size: 10.5px; color: #c9d6e5; margin-top: 3px; line-height: 1.45;
    white-space: pre-line; max-height: 110px; overflow-y: auto; word-break: break-all;
    background: rgba(255,255,255,.04); border-left: 2px solid var(--border);
    padding: 4px 7px; border-radius: 0 6px 6px 0; }
  #tomorrowBox { display: none; margin: 6px 10px 2px; padding: 7px 10px;
    background: rgba(88, 60, 160, .18); border: 1px solid #5b4a9e; border-radius: 9px; }
  .tmr-hd { font-size: 11.5px; font-weight: 700; color: #c9b8ff; margin-bottom: 3px; }
  .tmr-item { margin-top: 4px; font-size: 11.5px; }
  .tmr-txt { font-size: 10.5px; color: #c9d6e5; white-space: pre-line;
    max-height: 90px; overflow-y: auto; margin-top: 1px; line-height: 1.4; }
  .line-links { font-size: 10px; margin-top: 3px; }
  .line-links a { color: #6ea8d8; text-decoration: none; margin-right: 9px; }
  .line-links a:hover { text-decoration: underline; }

  #legend { position: absolute; bottom: 70px; left: 10px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 11px; font-size: 11px; line-height: 1.8; }
  #legend .chip { display: inline-block; width: 18px; height: 5px; border-radius: 3px;
    margin-right: 6px; vertical-align: middle; }
  #legend .mini-chip { background:
    repeating-linear-gradient(90deg, #2ecc71 0 5px, transparent 5px 9px); }
  @media (max-width: 640px) { #legend { display: none; } }
  #panel footer { padding: 7px 14px 9px; border-top: 1px solid var(--border);
    font-size: 9.5px; color: var(--muted); line-height: 1.5; }
  #panel footer a { color: #6ea8d8; text-decoration: none; }

  #basemapCtl { position: absolute; bottom: 22px; left: 10px; z-index: 1000;
    display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; padding: 4px; }
  #basemapCtl button { background: none; border: none; color: var(--muted);
    font: inherit; font-size: 11.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  #basemapCtl button.on { background: #2b5f8f; color: #fff; }
  #warnCtl { position: absolute; bottom: 22px; left: 178px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 4px; }
  #warnCtl button { background: none; border: none; color: var(--muted);
    font: inherit; font-size: 11.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  #warnCtl button.on { background: #7a3b10; color: #ffd9a8; }
  #warnLegend { display: none; margin-top: 5px; border-top: 1px solid var(--border); padding-top: 4px; }

  #toggleBtn { display: none; }
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 0; left: 0; right: 0; width: auto;
      max-height: 46%; border-radius: 14px 14px 0 0; }
    #basemapCtl { bottom: auto; top: 10px; }
    #toggleBtn { display: block; position: absolute; right: 12px; top: 8px;
      background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }
  }
  .st-normal { color: var(--c-normal); } .st-info { color: var(--c-info); }
  .st-delay { color: var(--c-delay); } .st-suspend { color: var(--c-suspend); }
  .st-unknown { color: var(--c-unknown); }
  .leaflet-tooltip.station-tip { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); font-size: 11px; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel);
    color: var(--text); }
  @keyframes blink { 50% { opacity: .25; } }
  .blink { animation: blink 1.1s linear infinite; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <header>
    <h1>🚄 <span class="em">新幹線</span>運行マップ</h1>
    <div id="updated">読み込み中…</div>
    <button id="toggleBtn" title="折りたたみ">▾</button>
  </header>
  <div id="tomorrowBox"></div>
  <div id="lines"></div>
  <footer>
    <span style="white-space:nowrap">🟢平常　🟡お知らせ　🟠遅れ　🔴見合わせ　⚪情報なし</span><br>
    経路: <a href="https://nlftp.mlit.go.jp/ksj/" target="_blank" rel="noopener">国土数値情報(N02-24)</a>を加工 ／
    運行情報: JR北海道・JR東日本・JR東海・JR西日本・JR九州の各公開情報(自動取得・目安) ／
    地図: Esri ｜ 公式の運行情報を必ずご確認ください
  </footer>
</div>

<div id="basemapCtl">
  <button data-b="dark" class="on">ダーク</button>
  <button data-b="topo">地形</button>
  <button data-b="sat">衛星</button>
</div>

<div id="legend">
  <b style="font-size:10.5px;color:#8b98a9">運行状況の色</b><br>
  <span class="chip" style="background:#2ecc71"></span>平常運転<br>
  <span class="chip" style="background:#f1c40f"></span>お知らせ・運転変更<br>
  <span class="chip" style="background:#f39c12"></span>遅れ<br>
  <span class="chip" style="background:#e74c3c"></span>運転見合わせ<br>
  <span class="chip" style="background:#7f8c9b"></span>情報取得失敗<br>
  <span class="chip mini-chip"></span>破線＝ミニ新幹線<br>
  <span style="color:#8b98a9;font-size:10px">太線＝影響区間</span>
  <div id="warnLegend">
    <b style="font-size:10.5px;color:#8b98a9">警報・注意報(気象庁)</b><br>
    <span class="chip" style="background:#0c000c;border:1px solid #666"></span>特別警報(レベル5)<br>
    <span class="chip" style="background:#aa00ab"></span>危険警報(レベル4)<br>
    <span class="chip" style="background:#ff2800"></span>警報(レベル3)<br>
    <span class="chip" style="background:#f2e700"></span>注意報(レベル2)<br>
    <span id="warnLegendNote" style="color:#8b98a9;font-size:10px"></span>
  </div>
</div>

<div id="warnCtl">
  <button id="warnBtn">⚠️ 警報・注意報</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';

const STATUS_COLOR = { normal: '#2ecc71', info: '#f1c40f', delay: '#f39c12',
                       suspend: '#e74c3c', unknown: '#7f8c9b' };
// 北から順に表示
const LINE_ORDER = ['hokkaido', 'tohoku', 'akita', 'yamagata', 'joetsu',
                    'hokuriku', 'tokaido', 'sanyo', 'kyushu', 'nishikyushu'];
// 各社の公式運行情報ページ
const JRE_URL = 'https://traininfo.jreast.co.jp/train_info/shinkansen.aspx';
const OFFICIAL = {
  hokkaido: [['JR北海道', 'https://www3.jrhokkaido.co.jp/webunkou/senku.html?id=24']],
  tohoku: [['JR東日本', JRE_URL]],
  yamagata: [['JR東日本', JRE_URL]],
  akita: [['JR東日本', JRE_URL]],
  joetsu: [['JR東日本', JRE_URL]],
  hokuriku: [['JR東日本', JRE_URL], ['JR西日本', 'https://trafficinfo.westjr.co.jp/']],
  tokaido: [['JR東海', 'https://traininfo.jr-central.co.jp/shinkansen/']],
  sanyo: [['JR西日本', 'https://trafficinfo.westjr.co.jp/']],
  kyushu: [['JR九州', 'https://www.jrkyushu.co.jp/trains/info/shin.html']],
  nishikyushu: [['JR九州', 'https://www.jrkyushu.co.jp/trains/info/nishi.html']],
};
function officialLinks(key) {
  return (OFFICIAL[key] || []).map(([n, u]) =>
    `<a href="${u}" target="_blank" rel="noopener">${n}の運行情報 ↗</a>`).join('');
}

// statusブランチの最新JSONを取得。GitHub APIが最も鮮度が高い(rawは最大5分キャッシュ)
const STATUS_SOURCES = [
  { url: 'https://api.github.com/repos/earlgrey04/kansai-air-watch/contents/shinkansen_status.json?ref=status',
    opts: { headers: { 'Accept': 'application/vnd.github.raw+json' } } },
  { url: 'https://raw.githubusercontent.com/earlgrey04/kansai-air-watch/status/shinkansen_status.json', bust: true },
  { url: 'shinkansen_status.json' },
];

const JAPAN_BOUNDS = [[30.8, 129.0], [45.9, 146.0]];
const fitPad = () => window.innerWidth > 640
  ? { paddingBottomRight: [310, 0] } : { paddingBottomRight: [0, Math.round(window.innerHeight * .40)] };
const map = L.map('map', { zoomControl: true, attributionControl: true })
  .fitBounds(JAPAN_BOUNDS, fitPad());
map.attributionControl.setPrefix(false);

const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const esriAttr = 'Tiles &copy; Esri';
const basemaps = {
  dark: L.layerGroup([
    L.tileLayer(esri + 'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 16, attribution: esriAttr }),
    L.tileLayer(esri + 'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 16 }),
  ]),
  topo: L.layerGroup([
    L.tileLayer(esri + 'World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 18, attribution: esriAttr }),
  ]),
  sat: L.layerGroup([
    L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 18, attribution: esriAttr }),
    L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 18 }),
  ]),
};
let curBase = basemaps.dark.addTo(map);
document.querySelectorAll('#basemapCtl button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#basemapCtl button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    map.removeLayer(curBase);
    curBase = basemaps[btn.dataset.b].addTo(map);
  });
});

const lineLayers = {};   // key -> {casing:[], stroke:[], bounds, raw}
const stationLayer = L.layerGroup();
const sectionLayer = L.layerGroup();   // 影響区間のオーバーレイ
let linesData = null;

function toLatLng(coords) { return coords.map(c => [c[1], c[0]]); }

// 路線上の駅from〜駅to間の座標列を切り出す(駅名が路線の駅リストに無い/遠い場合はnull)
function sectionCoords(lineObj, lineName, from, to) {
  const find = n => {
    const s = linesData.stations.find(s => s.l === lineName && s.n === n);
    return s && s.c;
  };
  const A = find(from), B = find(to);
  if (!A || !B) return null;
  const near = (piece, pt) => {
    let best = -1, bd = Infinity;
    for (let i = 0; i < piece.length; i++) {
      const dx = piece[i][0] - pt[0], dy = piece[i][1] - pt[1], d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return bd < 0.0036 ? best : -1;  // 約0.06°(≒6km)以内のみ有効
  };
  for (const piece of lineObj.coords) {
    const ia = near(piece, A), ib = near(piece, B);
    if (ia >= 0 && ib >= 0 && ia !== ib) {
      const [s, e] = ia < ib ? [ia, ib] : [ib, ia];
      return piece.slice(s, e + 1);
    }
  }
  return null;
}

function drawLines(data) {
  linesData = data;
  for (const [key, ln] of Object.entries(data.lines)) {
    const casing = [], stroke = [];
    let bounds = null;
    const dash = ln.type === 'mini' ? '6 7' : null;
    for (const seg of ln.coords) {
      const ll = toLatLng(seg);
      casing.push(L.polyline(ll, { color: '#000', opacity: .55,
        weight: ln.type === 'mini' ? 5.5 : 7, interactive: false }).addTo(map));
      const s = L.polyline(ll, { color: STATUS_COLOR.unknown,
        weight: ln.type === 'mini' ? 2.5 : 3.5, opacity: .95, dashArray: dash });
      s.bindTooltip(ln.name, { sticky: true, className: 'station-tip' });
      s.on('click', () => showPopup(key));
      s.addTo(map);
      stroke.push(s);
      bounds = bounds ? bounds.extend(s.getBounds()) : s.getBounds();
    }
    lineLayers[key] = { casing, stroke, bounds, name: ln.name, operator: ln.operator, raw: ln };
  }
  sectionLayer.addTo(map);
  for (const st of data.stations) {
    const m = L.circleMarker([st.c[1], st.c[0]], { radius: 3, color: '#fff',
      weight: 1, fillColor: '#9fc9ff', fillOpacity: .9 });
    m.bindTooltip(`${st.n}（${st.l}）`, { className: 'station-tip' });
    stationLayer.addLayer(m);
  }
  const syncStations = () => {
    if (map.getZoom() >= 7) { if (!map.hasLayer(stationLayer)) map.addLayer(stationLayer); }
    else if (map.hasLayer(stationLayer)) map.removeLayer(stationLayer);
  };
  map.on('zoomend', syncStations);
  syncStations();
}

let statusData = null;
function showPopup(key) {
  const ll = lineLayers[key];
  const st = statusData && statusData.lines[key];
  if (!ll) return;
  const stHtml = st
    ? `<div class="line-status st-${st.status}">●&nbsp;${st.label}</div>
       ${st.detail ? `<div class="line-notice">${escapeHtml(st.detail)}</div>`
                   : `<div class="line-detail">${escapeHtml(st.text || '')}</div>`}
       <div class="line-detail">情報源: ${escapeHtml(st.source || '')}</div>
       <div class="line-links">${officialLinks(key)}</div>`
    : `<div class="line-links">${officialLinks(key)}</div>`;
  L.popup({ maxWidth: 260 })
    .setLatLng(ll.bounds.getCenter())
    .setContent(`<div class="line-name">${ll.name}<small>${ll.operator}</small></div>${stHtml}`)
    .openOn(map);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function applyStatus(data) {
  statusData = data;
  sectionLayer.clearLayers();
  for (const [key, ll] of Object.entries(lineLayers)) {
    const st = data.lines[key] || { status: 'unknown' };
    // 影響区間が経路上に特定できた場合: 本線は緑にして区間だけ色を付ける
    const mapped = [];
    for (const sec of st.sections || []) {
      const path = sectionCoords(ll.raw, ll.name, sec.from, sec.to);
      if (path && sec.status !== 'normal') mapped.push({ sec, path });
    }
    const baseColor = mapped.length ? STATUS_COLOR.normal
                                    : (STATUS_COLOR[st.status] || STATUS_COLOR.unknown);
    for (const s of ll.stroke) {
      s.setStyle({ color: baseColor });
      const el = s.getElement();
      if (el) el.classList.toggle('blink', !mapped.length && st.status === 'suspend');
    }
    for (const { sec, path } of mapped) {
      const ll2 = toLatLng(path);
      sectionLayer.addLayer(L.polyline(ll2, { color: '#000', opacity: .6,
        weight: 9, interactive: false }));
      const p = L.polyline(ll2, { color: STATUS_COLOR[sec.status] || STATUS_COLOR.info,
        weight: 5.5, opacity: 1 });
      p.bindTooltip(`${ll.name} ${sec.from}〜${sec.to}: ${LABELS_JA[sec.status] || sec.status}`,
        { sticky: true, className: 'station-tip' });
      p.on('click', () => showPopup(key));
      sectionLayer.addLayer(p);
      if (sec.status === 'suspend') {
        const el = p.getElement();
        if (el) el.classList.add('blink');
      }
    }
  }
  renderPanel(data);
}
const LABELS_JA = { info: 'お知らせ', delay: '遅れ', suspend: '運転見合わせ' };

// 計画運休・翌日以降の運行情報(発表がある時だけ表示)
function renderTomorrow(data) {
  const box = document.getElementById('tomorrowBox');
  const items = (data.tomorrow && data.tomorrow.items) || [];
  if (!items.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'block';
  box.innerHTML = '<div class="tmr-hd">📅 計画運休・翌日以降の運行情報</div>' +
    items.map(it => `
      <div class="tmr-item"><span class="st-${it.status}">●</span>
        <b>${escapeHtml(it.name || '')}</b>
        <div class="tmr-txt">${escapeHtml(it.text || '')}</div>
      </div>`).join('');
}

function renderPanel(data) {
  renderTomorrow(data);
  const box = document.getElementById('lines');
  box.innerHTML = '';
  for (const key of LINE_ORDER) {
    const ll = lineLayers[key];
    const st = data.lines[key] || { status: 'unknown', label: '情報なし', text: '' };
    if (!ll) continue;
    const row = document.createElement('div');
    row.className = 'line-row';
    const notNormal = st.status !== 'normal';
    row.innerHTML = `
      <div class="dot" style="background:${STATUS_COLOR[st.status]};color:${STATUS_COLOR[st.status]}"></div>
      <div style="min-width:0;flex:1">
        <div class="line-name">${ll.name}<small>${ll.operator}</small></div>
        <div class="line-status st-${st.status}">${st.label}</div>
        ${notNormal && st.text && st.text !== st.label ? `<div class="line-detail">${escapeHtml(st.text)}</div>` : ''}
        ${notNormal && st.detail ? `<div class="line-notice">${escapeHtml(st.detail)}</div>` : ''}
        <div class="line-links">${officialLinks(key)}</div>
      </div>`;
    row.addEventListener('click', () => {
      map.fitBounds(ll.bounds.pad(0.15));
      showPopup(key);
    });
    // リンクや本文のスクロール操作でズームが誘発されないように
    row.querySelectorAll('.line-links a, .line-notice').forEach(el =>
      el.addEventListener('click', e => e.stopPropagation()));
    box.appendChild(row);
  }
  const up = document.getElementById('updated');
  const t = data.updated ? new Date(data.updated) : null;
  const ts = t ? `${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}` : '--';
  const stale = t && (Date.now() - t.getTime()) > 60 * 60 * 1000;
  up.innerHTML = `運行情報 ${ts} 時点${stale ? ' <span class="err">(更新が古い可能性)</span>' : ''}` +
    (data.errors && data.errors.length ? ' <span class="err">(一部取得失敗)</span>' : '');
}

async function fetchStatus() {
  for (const src of STATUS_SOURCES) {
    try {
      const url = src.bust ? `${src.url}?t=${Date.now()}` : src.url;
      const r = await fetch(url, { cache: 'no-store', ...(src.opts || {}) });
      if (!r.ok) continue;
      return await r.json();
    } catch (e) { /* 次の候補へ */ }
  }
  return null;
}

async function init() {
  const linesRes = await fetch('shinkansen_lines.json');
  drawLines(await linesRes.json());
  const st = await fetchStatus();
  if (st) applyStatus(st);
  else document.getElementById('updated').innerHTML =
    '<span class="err">運行情報を取得できませんでした</span>';
}
init();
setInterval(async () => {
  const st = await fetchStatus();
  if (st) applyStatus(st);
}, 5 * 60 * 1000);

document.getElementById('toggleBtn').addEventListener('click', () => {
  const el = document.getElementById('lines');
  el.style.display = el.style.display === 'none' ? '' : 'none';
});

// ===== 警報・注意報レイヤー(気象庁) =====
// ズームアウト時=官署(都道府県)単位の最大レベル、ズームイン時=市町村単位で色分け
const WARN_COLOR = { 20: '#f2e700', 30: '#ff2800', 40: '#aa00ab', 50: '#0c000c' };
const WARN_NAME = {
  '33': '大雨特別警報', '43': '大雨危険警報', '03': '大雨警報', '10': '大雨注意報',
  '39': '土砂災害特別警報', '49': '土砂災害危険警報', '09': '土砂災害警報', '29': '土砂災害注意報',
  '38': '高潮特別警報', '48': '高潮危険警報', '08': '高潮警報', '19': '高潮注意報',
  '35': '暴風特別警報', '05': '暴風警報', '15': '強風注意報',
  '32': '暴風雪特別警報', '02': '暴風雪警報', '13': '風雪注意報',
  '36': '大雪特別警報', '06': '大雪警報', '12': '大雪注意報',
  '37': '波浪特別警報', '07': '波浪警報', '16': '波浪注意報',
  '53': '洪水特別警報', '51': '洪水特別警報', '41': '洪水危険警報', '40': '洪水危険警報',
  '31': '洪水警報', '30': '洪水警報', '04': '洪水警報', '18': '洪水注意報',
  '14': '雷注意報', '17': '融雪注意報', '20': '濃霧注意報', '21': '乾燥注意報',
  '22': 'なだれ注意報', '23': '低温注意報', '24': '霜注意報', '25': '着氷注意報', '26': '着雪注意報',
};
const WARN_DATA_URLS = [
  { url: 'https://api.github.com/repos/earlgrey04/kansai-air-watch/contents/weather_warnings.json?ref=status',
    opts: { headers: { 'Accept': 'application/vnd.github.raw+json' } } },
  { url: 'https://raw.githubusercontent.com/earlgrey04/kansai-air-watch/status/weather_warnings.json', bust: true },
  { url: 'weather_warnings.json' },
];
const WARN_MUNI_ZOOM = 8;   // このズーム以上で市町村単位表示
let warnOn = false, warnAreas = null, warnData = null, warnGeo = null;
let warnOfficeMax = {};
map.createPane('warnPane').style.zIndex = 350;   // 路線(overlayPane=400)より下
const warnRenderer = L.canvas({ pane: 'warnPane' });

async function fetchWarnData() {
  for (const src of WARN_DATA_URLS) {
    try {
      const url = src.bust ? `${src.url}?t=${Date.now()}` : src.url;
      const r = await fetch(url, { cache: 'no-store', ...(src.opts || {}) });
      if (!r.ok) continue;
      return await r.json();
    } catch (e) { /* 次へ */ }
  }
  return null;
}

function warnLevelOf(props) {
  if (!warnData) return 0;
  if (map.getZoom() >= WARN_MUNI_ZOOM) {
    const m = warnData.munis[props.c];
    return m ? m.lv : 0;
  }
  return warnOfficeMax[props.o] || 0;
}

function warnStyle(feat) {
  const lv = warnLevelOf(feat.properties);
  const muni = map.getZoom() >= WARN_MUNI_ZOOM;
  return {
    fillColor: WARN_COLOR[lv] || '#000', fillOpacity: lv ? 0.45 : 0,
    color: muni ? '#556' : '#333', weight: muni ? 0.5 : 0.2, opacity: muni ? 0.6 : 0.12,
  };
}

function warnTooltip(props) {
  const muni = map.getZoom() >= WARN_MUNI_ZOOM;
  if (muni) {
    const m = warnData && warnData.munis[props.c];
    const names = m ? m.k.map(k => WARN_NAME[k] || `コード${k}`).join('・') : '発表なし';
    return `${props.n}: ${names}`;
  }
  const lv = warnOfficeMax[props.o] || 0;
  const lbl = { 20: '注意報', 30: '警報', 40: '危険警報', 50: '特別警報' }[lv] || '発表なし';
  return `管内最大: ${lbl}（ズームで市町村別）`;
}

function buildWarnLayer() {
  if (warnGeo) { map.removeLayer(warnGeo); }
  warnGeo = L.geoJSON(warnAreas, {
    renderer: warnRenderer, pane: 'warnPane', style: warnStyle,
    onEachFeature: (f, l) => l.bindTooltip(() => warnTooltip(f.properties),
      { sticky: true, className: 'station-tip' }),
  }).addTo(map);
}

function computeOfficeMax() {
  warnOfficeMax = {};
  if (!warnData || !warnAreas) return;
  const officeOf = {};
  for (const f of warnAreas.features) officeOf[f.properties.c] = f.properties.o;
  for (const [c, m] of Object.entries(warnData.munis)) {
    const o = officeOf[c];
    if (o && m.lv > (warnOfficeMax[o] || 0)) warnOfficeMax[o] = m.lv;
  }
}

async function refreshWarnData() {
  const d = await fetchWarnData();
  if (!d) return false;
  warnData = d;
  computeOfficeMax();
  const t = d.reportDatetime ? d.reportDatetime.slice(11, 16) : '--:--';
  document.getElementById('warnLegendNote').textContent =
    `出典: 気象庁（${t}時点） ズームで都道府県⇔市町村切替`;
  if (warnGeo) warnGeo.setStyle(warnStyle);
  return true;
}

document.getElementById('warnBtn').addEventListener('click', async () => {
  const btn = document.getElementById('warnBtn');
  warnOn = !warnOn;
  btn.classList.toggle('on', warnOn);
  const lg = document.getElementById('warnLegend');
  if (warnOn) {
    btn.textContent = '⚠️ 読み込み中…';
    try {
      if (!warnAreas) warnAreas = await (await fetch('warn_areas.json')).json();
      const ok = await refreshWarnData();
      if (!ok || !warnAreas) throw new Error('データ取得失敗');
      buildWarnLayer();
      lg.style.display = 'block';
      btn.textContent = '⚠️ 警報・注意報';
    } catch (e) {
      warnOn = false; btn.classList.remove('on');
      btn.textContent = '⚠️ 取得失敗';
      setTimeout(() => { btn.textContent = '⚠️ 警報・注意報'; }, 4000);
    }
  } else {
    if (warnGeo) { map.removeLayer(warnGeo); warnGeo = null; }
    lg.style.display = 'none';
  }
});
map.on('zoomend', () => { if (warnOn && warnGeo) warnGeo.setStyle(warnStyle); });
setInterval(() => { if (warnOn) refreshWarnData(); }, 5 * 60 * 1000);
</script>
</body>
</html>
