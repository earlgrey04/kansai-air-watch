<style>

  /* ===== スマホ/タブレット: 上メニューの重なり／右はみ出し対策 ===== */
  @media (max-width: 820px){
    /* ボタンバー: 画面幅いっぱい＋“折り返し”。折り返しは横にはみ出さない（雨雲ボタンも収まる） */

    /* HUD はバー(最大2段)の下へ */

    /* 衛星カテゴリ／地震期間バー: 下部・折り返し（各モード時のみ） */

  <span class="hd">破線＝ミニ新幹線／太線＝影響区間<br>線クリックで発表内容を表示</span><br>

<div id="eqBigYear" style="display:none;position:absolute;top:14%;left:50%;transform:translateX(-50%);font:bold 72px system-ui,sans-serif;color:rgba(255,255,255,0.92);text-shadow:0 2px 12px rgba(0,0,0,0.8);letter-spacing:2px;pointer-events:none;z-index:5"></div>
<script>
const SUPA = "https://iisatjsohjknjldpjslb.supabase.co";
const KEY  = "sb_publishable_JeYLiw0skEB5v5byzQYhEQ_WHZ-I-zJ";
const HDRS = { apikey: KEY, Authorization: "Bearer " + KEY };
const MODEL_URL = "https://cesium.com/downloads/cesiumjs/releases/1.118/Apps/SampleData/models/CesiumAir/Cesium_Air.glb";
const FT2M = 0.3048;
const setErr = m => { const e=document.getElementById('err'); if(!m){e.style.display='none';return;} e.style.display='block'; e.textContent=m; };
const setModeLbl = t => { document.getElementById('mode').textContent=t; const u=document.getElementById('cntUnit'); if(u)u.style.display=(t==='LIVE')?'':'none'; };
window.onerror = (m,src,l,c,e)=>{ try{ setErr("JSエラー: "+m+" @"+l); }catch(_){} };

Cesium.Ion.defaultAccessToken = "";

// 国土地理院DEM(標高PNGタイル)を解読して3D地形にする（トークン不要・日本を高精細カバー）
function gsiTerrain(){
  const TSZ=256, MAXZ=14, N=64;
  const dec=(r,g,b)=>{ if(r===128&&g===0&&b===0) return 0; const u=r*65536+g*256+b; return u<8388608 ? u*0.01 : (u-16777216)*0.01; };
  return new Cesium.CustomHeightmapTerrainProvider({
    width:N, height:N, tilingScheme:new Cesium.WebMercatorTilingScheme(),
    callback:(x,y,level)=>{
      if(level>MAXZ) return undefined;
      return new Promise((resolve)=>{
        const img=new Image(); img.crossOrigin="anonymous";
        img.onload=()=>{ try{
          const cv=document.createElement("canvas"); cv.width=TSZ; cv.height=TSZ;
          const ctx=cv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(img,0,0,TSZ,TSZ);
          const d=ctx.getImageData(0,0,TSZ,TSZ).data; const out=new Float32Array(N*N);
          for(let j=0;j<N;j++)for(let i=0;i<N;i++){
            const px=Math.round(i/(N-1)*(TSZ-1)), py=Math.round(j/(N-1)*(TSZ-1)); const o=(py*TSZ+px)*4;
            out[j*N+i]=dec(d[o],d[o+1],d[o+2]);
          }
          resolve(out);
        }catch(e){ resolve(undefined); } };
        img.onerror=()=>resolve(undefined);
        img.src=`https://cyberjapandata.gsi.go.jp/xyz/dem_png/${level}/${x}/${y}.png`;
      });
    }
  });
}

// 地形は初期化後に「後付け」で安全に適用（失敗しても地図は平坦で表示され続ける）
const viewer = new Cesium.Viewer("cesiumContainer", {
  baseLayer:false, baseLayerPicker:false, geocoder:false, homeButton:false,
  sceneModePicker:false, navigationHelpButton:false, fullscreenButton:false,
  animation:true, timeline:true, infoBox:true, selectionIndicator:true,
});
viewer.scene.globe.enableLighting = false;  // 太陽依存の陰影オフ（夜でも暗くならない）
// ===== 気象（雨雲アニメ：気象庁の“予測”タイルを時系列で動かす）=====
// nowc/N1=実況(5分) / nowc/N2=予測(5分,〜60分) / rasrf=降水短時間予報(1時間,〜15h)
let weatherOn=false, curBasemap='light';
let satPhoto='esri'; // 衛星写真ベースマップ既定=Esri高解像実写（null=地図 / 'modis'=日次真彩色）
function refreshPhotoButtons(){ // モード切替でボタンonが消えるので実写ボタンの状態を再適用
  const m=document.getElementById('bModis'), e=document.getElementById('bEsri'), o=document.getElementById('bOcean');
  if(m) m.classList.toggle('on', satPhoto==='modis');
  if(e) e.classList.toggle('on', satPhoto==='esri');
  if(o) o.classList.toggle('on', satPhoto==='ocean');
}
function gibsDate(){ const d=new Date(Date.now()-24*3600e3); return d.toISOString().slice(0,10); } // 前日UTC（GIBS配信済み）
// 実写ベースマップ: MODIS / Esri を個別トグル（もう一度押すと地図に戻る・相互排他）
function setSatPhoto(kind){
  satPhoto = (satPhoto===kind) ? null : kind;
  refreshPhotoButtons();
  setBasemap(curBasemap);
}
let wxLayers={}, wxFrames=[], wxIndex=0, wxTimer=null; // wxLayers: idx→ImageryLayer（生成後キャッシュ＝チカチカ防止）
let lightningOn=false, lightningLayer=null, lightningTimer=null; // 雷ナウキャスト(thns)重畳
let busyToggle=false; // 雨雲/雷トグルの非同期処理中フラグ（連打レース防止）
let wxFramesCache=null, wxFramesCacheT=0; // buildWeatherFrames の短期キャッシュ
const JMA="https://www.jma.go.jp/bosai/jmatile/data";
// "YYYYMMDDHHmmss"(UTC) → epoch ms
function jmaMs(s){ return Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),+(s.slice(12,14)||0)); }
function jstLabel(ms){ return new Date(ms).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
async function fetchTT(u){ try{ return await (await fetch(u)).json(); }catch(e){ return []; } }

// 実況30分＋予測(5分×〜60分＋1時間×〜15h)のフレーム列を作る
async function buildWeatherFrames(){
  if(wxFramesCache && Date.now()-wxFramesCacheT < 60000) return wxFramesCache; // 60秒キャッシュ（再表示を高速化）
  const [n1,n2,ra]=await Promise.all([
    fetchTT(`${JMA}/nowc/targetTimes_N1.json`),
    fetchTT(`${JMA}/nowc/targetTimes_N2.json`),
    fetchTT(`${JMA}/rasrf/targetTimes.json`),
  ]);
  const now=Date.now(), fr=[];
  for(const e of n1){ const t=jmaMs(e.validtime); if(t>=now-30*60000) fr.push({base:e.basetime,valid:e.validtime,path:'nowc',prod:'hrpns',max:14,t,kind:'obs'}); }
  let maxN2=0;
  for(const e of n2){ const t=jmaMs(e.validtime); maxN2=Math.max(maxN2,t); fr.push({base:e.basetime,valid:e.validtime,path:'nowc',prod:'hrpns',max:14,t,kind:'fcst'}); }
  if(ra.length){
    // rasrf は 0-6h と 7-15h を別 basetime で段階配信し、最新 run はタイル生成が遅れて404のことがある。
    // 各予測時刻(validtime)ごとに、新しい basetime から順に「タイルが実在(公開済み)する run」を採用して
    // run をまたいで連続させる（発表待ちの時刻は自動で除外→10分毎の再構築で埋まる）。
    const cand={};
    for(const e of ra){ (cand[e.validtime]=cand[e.validtime]||new Set()).add(e.basetime); }
    const futVs=Object.keys(cand).filter(v=>jmaMs(v)>maxN2+60000);
    const picked=await Promise.all(futVs.map(async (v)=>{
      for(const b of [...cand[v]].sort().reverse().slice(0,4)){ // 新しい順に最大4run試す
        try{ const r=await fetch(`${JMA}/rasrf/${b}/none/${v}/surf/rasrf/6/56/25.png`,{cache:'no-store'}); if(r.ok) return {base:b,valid:v,path:'rasrf',prod:'rasrf',max:8,t:jmaMs(v),kind:'fcst'}; }catch(e){}
      }
      return null;
    }));
    for(const p of picked) if(p) fr.push(p);
  }
  fr.sort((a,b)=>a.t-b.t);
  const seen=new Set(), out=[]; for(const f of fr){ if(!seen.has(f.t)){ seen.add(f.t); out.push(f); } }
  wxFramesCache=out; wxFramesCacheT=Date.now();
  return out;
}
// フレーム i のレイヤーを（無ければ）生成してキャッシュ。maximumLevel はプロダクト別。
function ensureWxLayer(i){
  if(wxLayers[i]) return wxLayers[i];
  const f=wxFrames[i];
  const L=viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
    url:`${JMA}/${f.path}/${f.base}/none/${f.valid}/surf/${f.prod}/{z}/{x}/{y}.png`, maximumLevel:f.max, credit:"気象庁" }));
  L.show=false; L.alpha=0;
  wxLayers[i]=L; return L;
}
function clearWxLayers(){ for(const k in wxLayers){ try{ viewer.imageryLayers.remove(wxLayers[k],true); }catch(e){} } wxLayers={}; }
const WX_PREFETCH=3; // 先読みフレーム数（順再生でタイルを先に読ませて切替を無瞬断に）
// 指定フレームを表示：alpha切替のみ＝チカチカしない。前方 WX_PREFETCH 枚を show=true で先読み、他は show=false（描画負荷ゼロ）
function showWeatherFrame(i){
  if(!weatherOn || curBasemap==='dark' || !wxFrames.length) return;
  wxIndex=((i%wxFrames.length)+wxFrames.length)%wxFrames.length;
  const win=new Set(); for(let k=0;k<=WX_PREFETCH;k++) win.add((wxIndex+k)%wxFrames.length);
  for(const k in wxLayers){ if(!win.has(+k)){ wxLayers[k].show=false; wxLayers[k].alpha=0; } } // ウィンドウ外は非表示
  for(const ki of win){ const L=ensureWxLayer(ki); L.show=true; L.alpha=(ki===wxIndex?0.82:0); } // 現在=表示 / 先読み=透明で読み込みだけ
  const f=wxFrames[wxIndex];
  const sl=document.getElementById('wxSlider'); if(sl){ sl.max=wxFrames.length-1; sl.value=wxIndex; }
  const lb=document.getElementById('wxTime'); if(lb) lb.textContent=(f.kind==='obs'?'実況 ':'予測 ')+jstLabel(f.t);
}
function wxPlay(){ if(wxTimer)return; const b=document.getElementById('wxPlay'); if(b)b.textContent='⏸'; wxTimer=setInterval(()=>showWeatherFrame(wxIndex+1),750); }
function wxPause(){ if(wxTimer){clearInterval(wxTimer);wxTimer=null;} const b=document.getElementById('wxPlay'); if(b)b.textContent='▶'; }
function wxTogglePlay(){ wxTimer?wxPause():wxPlay(); }
function wxSeek(v){ wxPause(); showWeatherFrame(+v); }

// 地図テーマ切替：飛行機モード=明るいVoyager / 衛星モード=暗い地図。雨雲ONなら現フレームを上に復元
function setBasemap(mode){
  curBasemap=mode;
  clearNewModes(); // プレート/水温の後始末を全遷移で一本化
  viewer.imageryLayers.removeAll(); wxLayers={}; lightningLayer=null;
  if(satPhoto==='modis'){
    // NASA GIBS MODIS Terra 真彩色（前日・全球・その日の雲つき衛星写真）
    viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
      url:`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/${gibsDate()}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
      maximumLevel:9, credit:"NASA EOSDIS GIBS / MODIS" }));
    viewer.scene.globe.baseColor = Cesium.Color.BLACK;
  } else if(satPhoto==='esri'){
    // Esri World Imagery（超高解像の実写）
    viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
      url:"https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      maximumLevel:19, credit:"Esri, Maxar, Earthstar Geographics" }));
    viewer.scene.globe.baseColor = Cesium.Color.BLACK;
  } else if(satPhoto==='ocean'){
    // GEBCO 水深図（鮮やかな深浅グラデーション）＋ Esri Ocean Reference（海溝・海盆などの地名）
    viewer.imageryLayers.addImageryProvider(new Cesium.WebMapServiceImageryProvider({
      url:"https://wms.gebco.net/mapserv?", layers:"GEBCO_LATEST",
      parameters:{ version:"1.3.0", format:"image/png", transparent:false },
      maximumLevel:7, credit:"GEBCO Compilation Group (GEBCO 2024 Grid)" }));
    viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
      url:"https://services.arcgisonline.com/arcgis/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}",
      maximumLevel:13, credit:"Esri" }));
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#0a2b45");
  } else {
    const url = mode==='dark'
      ? "https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png"
      : "https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png";
    viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
      url, credit:"© CARTO © OpenStreetMap contributors", maximumLevel:19 }));
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString(mode==='dark'?"#050a12":"#cfe1ef");
  }
  if(weatherOn && mode!=='dark' && wxFrames.length) showWeatherFrame(wxIndex);
  if(lightningOn && mode!=='dark') loadLightning(); // 雷ナウキャストを上に復元
}

// 明るい地図の上で映えるよう、濃いめの高彩度に。低高度=赤橙→高高度=濃青
function altColor(ft){
  if (ft == null || ft < 0) return Cesium.Color.fromCssColorString("#5b6b7b"); // 通過機/不明=濃い灰
  const h = Math.max(15, Math.min(230, 15 + (ft/42000)*215)); // 15(赤橙)→230(青)
  return Cesium.Color.fromHsl(h/360, 0.95, 0.45, 1.0);
}
function planeModel(colorProp){
  return { uri:MODEL_URL, minimumPixelSize:44, maximumScale:14000, scale:1.0,
           color:colorProp, colorBlendMode:Cesium.ColorBlendMode.MIX, colorBlendAmount:0.6,
           // 濃紺の縁取り＝どんな地図色の上でも機体がくっきり浮く
           silhouetteColor:Cesium.Color.fromCssColorString("#0b1a2b"), silhouetteSize:1.6 };
}
function labelGraphics(text){
  return { text, font:"12px sans-serif", pixelOffset:new Cesium.Cartesian2(0,-24),
           fillColor:Cesium.Color.WHITE, style:Cesium.LabelStyle.FILL_AND_OUTLINE,
           outlineWidth:3, outlineColor:Cesium.Color.BLACK, scaleByDistance:new Cesium.NearFarScalar(5e4,1,6e5,0.4) };
}
function groundOf(pos){ const c=Cesium.Cartographic.fromCartesian(pos); return Cesium.Cartesian3.fromRadians(c.longitude,c.latitude,0); }

// track(方位°)→ワールド方向ベクトル（その地点の東西南北から）
const _m4=new Cesium.Matrix4();
function headingVec(lon, lat, trackDeg){
  if (trackDeg==null||isNaN(trackDeg)) return undefined;
  const p=Cesium.Cartesian3.fromDegrees(lon,lat);
  const enu=Cesium.Transforms.eastNorthUpToFixedFrame(p,undefined,_m4);
  const th=Cesium.Math.toRadians(trackDeg);
  const local=new Cesium.Cartesian3(Math.sin(th),Math.cos(th),0); // 東=sin,北=cos
  const w=Cesium.Matrix4.multiplyByPointAsVector(enu,local,new Cesium.Cartesian3());
  return Cesium.Cartesian3.normalize(w,w);
}
// 位置と前方ベクトルから、3Dモデルの向き(クォータニオン)を直接構築（速度差分に頼らない＝震えない）
function modelOrientation(pos, fwd){
  if(!fwd) return undefined;
  const up=Cesium.Cartesian3.normalize(pos,new Cesium.Cartesian3());
  const x=Cesium.Cartesian3.normalize(fwd,new Cesium.Cartesian3());        // 前(+X=機首)
  const y=Cesium.Cartesian3.cross(up,x,new Cesium.Cartesian3());
  if(Cesium.Cartesian3.magnitude(y)<1e-7) return undefined;
  Cesium.Cartesian3.normalize(y,y);
  const z=Cesium.Cartesian3.cross(x,y,new Cesium.Cartesian3());            // 上(+Z)
  const rot=new Cesium.Matrix3(x.x,y.x,z.x, x.y,y.y,z.y, x.z,y.z,z.z);
  return Cesium.Quaternion.fromRotationMatrix(rot);
}

function upsertLive(a){
  const ft=(a.alt_baro==="ground")?0:(typeof a.alt_baro==="number"?a.alt_baro:null);
  const pos=Cesium.Cartesian3.fromDegrees(a.lon,a.lat,Math.max(0,(ft??0)*FT2M));
  const col=altColor(ft); const cs=(a.flight||"").trim()||a.hex;
  const ori=modelOrientation(pos, headingVec(a.lon,a.lat,a.track));
  const route=(a.origCity&&a.destCity)?`${a.origCity} → ${a.destCity}`:"";
  const desc=`<table><tr><td>便名</td><td><b>${cs}</b></td></tr><tr><td>路線</td><td>${route||"–"}</td></tr>`+
    `<tr><td>高度</td><td>${ft!=null?ft.toLocaleString()+" ft":"–"}</td></tr>`+
    `<tr><td>速度</td><td>${a.gs!=null?Math.round(a.gs)+" kt":"–"}</td></tr><tr><td>機種</td><td>${a.t||a.desc||"–"}</td></tr></table>`;
  let p=planes[a.hex];
  if(!p){
    const ent=viewer.entities.add({ position:pos, model:planeModel(col), orientation:ori, label:labelGraphics(cs), description:desc });
    const line=viewer.entities.add({ polyline:{ positions:[pos,groundOf(pos)], width:1, material:col.withAlpha(0.35) } });
    planes[a.hex]={ent,line};
  } else {
    p.ent.position=pos; if(ori) p.ent.orientation=ori; p.ent.model.color=col; p.ent.label.text=cs; p.ent.description=desc;
    p.line.polyline.positions=[pos,groundOf(pos)]; p.line.polyline.material=col.withAlpha(0.35);
  }
  planes[a.hex]._seen=Date.now();
}
async function pollLive(){

    const r=await fetch(`${SUPA}/rest/v1/feed_snapshot?select=data&limit=1`,{headers:HDRS});
    const j=await r.json();

    let n=0; for(const a of list){ if(a.lat!=null&&a.lon!=null){ upsertLive(a); n++; } }

// ===== REPLAY =====（位置=補間、向き=各時刻のtrackから直接構築）
function trackAt(arr, jt){
  const s=Cesium.JulianDate.toDate(jt).getTime()/1000;
  let lo=0,hi=arr.length-1,ans=arr.length?arr[0][1]:null;
  while(lo<=hi){ const mid=(lo+hi)>>1; if(arr[mid][0]<=s){ ans=arr[mid][1]; lo=mid+1; } else hi=mid-1; }
  return ans;
}
async function loadFrames(hoursBack){
  const now=Date.now(), frames=[], p2=n=>String(n).padStart(2,'0');
  for(let h=hoursBack;h>=0;h--){
    const d=new Date(now-h*3600e3);
    const path=`${d.getUTCFullYear()}/${p2(d.getUTCMonth()+1)}/${p2(d.getUTCDate())}/${p2(d.getUTCHours())}`;
    try{
      const buf=await (await fetch(`${SUPA}/storage/v1/object/public/history/${path}.jsonl.gz`)).arrayBuffer();
      const text=pako.inflate(new Uint8Array(buf),{to:'string'});
      for(const line of text.split('\n')){ if(line.trim()) frames.push(JSON.parse(line)); }
    }catch(e){}
  }
  frames.sort((a,b)=>a.t-b.t); return frames;
}
async function setReplay(hoursBack){
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  weatherOff(); quakesOff(); lightningOff(); volcanoesOff(); // リプレイに入るときは各モードを抜ける
  document.querySelectorAll('#bar button').forEach(b=>b.classList.remove('on')); refreshPhotoButtons();
  if(window.event&&event.target)event.target.classList.add('on'); setModeLbl("REPLAY "+hoursBack+"h");
  clearStarlink(); setBasemap('light'); kansaiView();
  setErr("履歴を読み込み中…"); clearAll();
  const frames=await loadFrames(hoursBack);
  if(!frames.length){ setErr("この期間の記録がありません"); return; }
  const t0=Cesium.JulianDate.fromDate(new Date(frames[0].t*1000));
  const t1=Cesium.JulianDate.fromDate(new Date(frames[frames.length-1].t*1000));
  const sampled={}, meta={}, trk={};
  for(const f of frames){
    const jt=Cesium.JulianDate.fromDate(new Date(f.t*1000));
    for(const x of f.a){
      const [hex,lat,lon,alt,track,gs,flight]=x;
      if(lat==null||lon==null) continue;
      if(!sampled[hex]){
        const sp=new Cesium.SampledPositionProperty();
        sp.setInterpolationOptions({interpolationDegree:1,interpolationAlgorithm:Cesium.LinearApproximation});
        sp.forwardExtrapolationType=Cesium.ExtrapolationType.NONE; sp.backwardExtrapolationType=Cesium.ExtrapolationType.NONE;
        sampled[hex]=sp; trk[hex]=[]; meta[hex]={flight:(flight||'').trim()||hex, first:jt.clone(), n:0, lastT:null};
      }
      if(meta[hex].lastT===f.t) continue;   // 同一時刻の重複を除去（位置ブレ防止）
      meta[hex].lastT=f.t;
      sampled[hex].addSample(jt, Cesium.Cartesian3.fromDegrees(lon,lat,Math.max(0,(alt===-1?0:alt)*FT2M)));
      if(track!=null) trk[hex].push([f.t,track]);
      meta[hex].last=jt.clone(); meta[hex].lastAlt=(alt===-1?0:alt); meta[hex].n++;
    }
  }
  for(const hex of Object.keys(sampled)){
    const m=meta[hex]; if(m.n<2) continue;
    const col=altColor(m.lastAlt); const sp=sampled[hex]; const tarr=trk[hex];
    // 向き：各時刻の位置とtrack(step参照)から直接構築（速度差分を使わない＝震えない）
    const ori = tarr.length
      ? new Cesium.CallbackProperty((time)=>{ const pp=sp.getValue(time); if(!pp) return undefined;
          const c=Cesium.Cartographic.fromCartesian(pp);
          const fwd=headingVec(Cesium.Math.toDegrees(c.longitude),Cesium.Math.toDegrees(c.latitude),trackAt(tarr,time));
          return modelOrientation(pp,fwd); }, false)
      : new Cesium.VelocityOrientationProperty(sp);
    viewer.entities.add({
      position:sp, model:planeModel(col), label:labelGraphics(m.flight), orientation:ori,
      path:{ leadTime:0, trailTime:600, width:2, material:col.withAlpha(0.5), resolution:5 },
      availability:new Cesium.TimeIntervalCollection([new Cesium.TimeInterval({start:m.first, stop:m.last})]),
    });
  }
  viewer.clock.startTime=t0.clone(); viewer.clock.stopTime=t1.clone(); viewer.clock.currentTime=t0.clone();
  viewer.clock.clockRange=Cesium.ClockRange.CLAMPED; viewer.clock.multiplier=60; viewer.clock.shouldAnimate=true;
  viewer.timeline.zoomTo(t0,t1);
  document.getElementById('cnt').textContent=Object.keys(sampled).length;
  document.getElementById('upd').textContent="タイムラインをドラッグで移動 / ▶で再生";
  setErr(null);
}

// ===== 衛星モード（TLE→SGP4）=====
function satPos(rec, date){
  try{
    const pv=satellite.propagate(rec,date); if(!pv||!pv.position) return undefined;
    const g=satellite.eciToGeodetic(pv.position, satellite.gstime(date));
    return Cesium.Cartesian3.fromRadians(g.longitude, g.latitude, g.height*1000);
  }catch(e){ return undefined; }
}
function parseTLE(txt){
  const sats=[], L=txt.split(/\r?\n/).filter(x=>x.trim());
  for(let i=0;i+2<L.length;i+=3){
    const nm=L[i].trim(), l1=L[i+1], l2=L[i+2];
    if(l1.startsWith("1 ")&&l2.startsWith("2 ")){ try{ sats.push({name:nm, rec:satellite.twoline2satrec(l1,l2)}); }catch(e){} }
  }
  return sats;
}
// TLEは6時間ブラウザキャッシュ（CelesTrakの再取得制限=403を回避／再クリックも即表示）
// specが"http"で始まれば完全URL（supplemental等）、そうでなければGROUP指定
async function fetchTLE(spec){
  const url = spec.startsWith("http") ? spec : "https://celestrak.org/NORAD/elements/gp.php?"+spec+"&FORMAT=tle";
  const key="tle_"+spec, TTL=6*3600*1000;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(key)||"null"); }catch(e){}
  if(cached&&cached.txt&&Date.now()-cached.t<TTL) return parseTLE(cached.txt);
  try{
    const txt=await (await fetch(url)).text();
    const sats=parseTLE(txt);
    if(sats.length){ try{ localStorage.setItem(key,JSON.stringify({t:Date.now(),txt})); }catch(e){} return sats; }
  }catch(e){}
  if(cached&&cached.txt) return parseTLE(cached.txt);  // 取得失敗/403時は古いキャッシュで代替
  return [];
}
function thin(arr, cap){ if(arr.length<=cap) return arr; const step=Math.ceil(arr.length/cap); return arr.filter((_,i)=>i%step===0); }

// ===== プレート境界＋運動ベクトル（地殻の動き・歪み）=====
// 境界線=Peter Bird(2002) 実データ / 運動ベクトル=NNR-MORVEL56モデルをEuler極から解析計算
// [和名, [Euler極緯度, 経度, 角速度°/百万年], 代表点[[緯,経],...]]
const PLATES=[
  ['太平洋',   [-63.58,114.70,0.651], [[0,-140],[-25,-125],[35,-170]]],
  ['北米',     [ -4.85,-80.64,0.209], [[45,-100]]],
  ['南米',     [-22.62,-112.83,0.109],[[-15,-60]]],
  ['ユーラシア',[ 48.85,-106.50,0.223],[[52,90]]],
  ['アフリカ', [ 47.68,-68.44,0.292], [[2,22]]],
  ['オーストラリア',[33.86,37.94,0.632],[[-25,133]]],
  ['南極',     [ 65.42,-118.11,0.250],[[-72,45]]],
  ['ナスカ',   [ 46.23,-101.06,0.696],[[-20,-90]]],
  ['インド',   [ 50.37,-3.29,0.544],  [[16,76]]],
  ['アラビア', [ 48.88,-8.49,0.559],  [[24,45]]],
  ['フィリピン海',[-46.02,-31.36,0.910],[[16,132]]],
  ['ココス',   [ 26.93,-124.31,1.198],[[7,-92]]],
  ['カリブ',   [ 35.20,-92.62,0.286], [[14,-73]]],
];
function llVec(latD, lonD){ const la=Cesium.Math.toRadians(latD), lo=Cesium.Math.toRadians(lonD);
  return [Math.cos(la)*Math.cos(lo), Math.cos(la)*Math.sin(lo), Math.sin(la)]; }
// Euler極からその地点の速度（cm/年）と進行方位（rad, 北基準時計回り）を求める
function plateVel(pole, latD, lonD){
  const P=llVec(pole[0],pole[1]), r=llVec(latD,lonD);
  const c=[P[1]*r[2]-P[2]*r[1], P[2]*r[0]-P[0]*r[2], P[0]*r[1]-P[1]*r[0]]; // P×r（|c|=sinθ）
  const la=Cesium.Math.toRadians(latD), lo=Cesium.Math.toRadians(lonD);
  const east=[-Math.sin(lo),Math.cos(lo),0];
  const north=[-Math.sin(la)*Math.cos(lo),-Math.sin(la)*Math.sin(lo),Math.cos(la)];
  const vE=c[0]*east[0]+c[1]*east[1]+c[2]*east[2];
  const vN=c[0]*north[0]+c[1]*north[1]+c[2]*north[2];
  const sinT=Math.hypot(c[0],c[1],c[2]);
  return { speed:11.12*pole[2]*sinT, az:Math.atan2(vE,vN) }; // 11.12=R·(π/180)/1e6 換算(cm/年)
}
// 始点から方位az・距離distKmの地点（球面）
function destLL(latD, lonD, az, distKm){
  const R=6371, d=distKm/R, la1=Cesium.Math.toRadians(latD), lo1=Cesium.Math.toRadians(lonD);
  const la2=Math.asin(Math.sin(la1)*Math.cos(d)+Math.cos(la1)*Math.sin(d)*Math.cos(az));
  const lo2=lo1+Math.atan2(Math.sin(az)*Math.sin(d)*Math.cos(la1), Math.cos(d)-Math.sin(la1)*Math.sin(la2));
  return [Cesium.Math.toDegrees(la2), Cesium.Math.toDegrees(lo2)];
}
async function loadPlateBoundaries(){
  try{
    if(plateBoundarySrc){ viewer.dataSources.remove(plateBoundarySrc,true); plateBoundarySrc=null; }
    const src=await Cesium.GeoJsonDataSource.load(
      'https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json',
      { clampToGround:false });
    for(const e of src.entities.values){ if(e.polyline){
      e.polyline.width=2.5; e.polyline.material=Cesium.Color.fromCssColorString('#ffb340').withAlpha(0.95); } }
    plateBoundarySrc=src; viewer.dataSources.add(src);
  }catch(e){ setErr('プレート境界の取得失敗: '+(e&&e.message||e)); }
}
function buildPlateVectors(){
  const K=140, col=Cesium.Color.fromCssColorString('#28e0d0'); // K=km/(cm/年) 矢印長スケール
  for(const [name,pole,pts] of PLATES){
    for(const [lat,lon] of pts){
      const {speed,az}=plateVel(pole,lat,lon); if(speed<0.05) continue;
      const [la2,lo2]=destLL(lat,lon,az, speed*K);
      const start=Cesium.Cartesian3.fromDegrees(lon,lat,30000);
      const end=Cesium.Cartesian3.fromDegrees(lo2,la2,30000);
      plateVecEnts.push(viewer.entities.add({ polyline:{ positions:[start,end], width:9,

const SHINK_COLOR={ normal:'#2ecc71', info:'#f1c40f', delay:'#f39c12', suspend:'#e74c3c', unknown:'#7f8c9b' };
const SHINK_STATUS_SOURCES=[  // shinkansen.html と同じ優先順(API=鮮度高, raw=CORS可だが約5分キャッシュ, 同梱=最終手段)
  { url:'https://api.github.com/repos/earlgrey04/kansai-air-watch/contents/shinkansen_status.json?ref=status',
    opts:{ headers:{ 'Accept':'application/vnd.github.raw+json' } } },

  { url:'shinkansen_status.json' },
];
async function fetchShinkStatus(){
  for(const s of SHINK_STATUS_SOURCES){
    try{
      const u=s.bust ? s.url+'?t='+Date.now() : s.url;
      const r=await fetch(u,{ cache:'no-store', ...(s.opts||{}) });
      if(r.ok) return await r.json();
    }catch(_){}
  }
  return null;
}
// 路線上の駅from〜駅to間の座標列を切り出す(shinkansen.htmlと同ロジック)
function shinkSectionCoords(lineObj, lineName, from, to){
  const find=n=>{ const s=shinkLinesData.stations.find(s=>s.l===lineName&&s.n===n); return s&&s.c; };
  const A=find(from), B=find(to);
  if(!A||!B) return null;
  const near=(piece,pt)=>{ let best=-1,bd=Infinity;
    for(let i=0;i<piece.length;i++){ const dx=piece[i][0]-pt[0],dy=piece[i][1]-pt[1],d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=i;} }
    return bd<0.0036?best:-1; };
  for(const piece of lineObj.coords){
    const ia=near(piece,A), ib=near(piece,B);
    if(ia>=0&&ib>=0&&ia!==ib){ const [s,e]=ia<ib?[ia,ib]:[ib,ia]; return piece.slice(s,e+1); }
  }
  return null;
}
const SHINK_LBL={ info:'お知らせ', delay:'遅れ', suspend:'運転見合わせ' };
const SHINK_JRE='https://traininfo.jreast.co.jp/train_info/shinkansen.aspx';
const SHINK_OFFICIAL={
  hokkaido:[['JR北海道','https://www3.jrhokkaido.co.jp/webunkou/senku.html?id=24']],
  tohoku:[['JR東日本',SHINK_JRE]], yamagata:[['JR東日本',SHINK_JRE]],
  akita:[['JR東日本',SHINK_JRE]], joetsu:[['JR東日本',SHINK_JRE]],
  hokuriku:[['JR東日本',SHINK_JRE],['JR西日本','https://trafficinfo.westjr.co.jp/']],
  tokaido:[['JR東海','https://traininfo.jr-central.co.jp/shinkansen/']],
  sanyo:[['JR西日本','https://trafficinfo.westjr.co.jp/']],
  kyushu:[['JR九州','https://www.jrkyushu.co.jp/trains/info/shin.html']],
  nishikyushu:[['JR九州','https://www.jrkyushu.co.jp/trains/info/nishi.html']],
};
const shinkEsc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function shinkLinksHtml(key){
  return (SHINK_OFFICIAL[key]||[]).map(([n,u])=>
    `<a href="${u}" target="_blank" rel="noopener" style="color:#8fc1ee">${n}の運行情報 ↗</a>`).join('　');
}
function shinkDescHtml(key, title, v){
  const body=v.detail||v.text||'';
  return `<div style="font-size:13px"><b>${shinkEsc(title)}</b><br>`+
    `状態: <b>${shinkEsc(v.label||SHINK_LBL[v.status]||v.status||'')}</b><br>`+
    `<div style="white-space:pre-line;max-height:180px;overflow-y:auto;margin:4px 0;`+
    `border-left:2px solid #456;padding-left:7px">${shinkEsc(body)}</div>`+
    `<span style="color:#889">情報源: ${shinkEsc(v.source||'')} ${v.asOf?'／'+v.asOf.slice(11,16)+'時点':''}</span><br>`+
    `${shinkLinksHtml(key)}</div>`;
}
function applyShinkStatus(st){
  if(!shinkLineEnts||!shinkSrc) return;
  for(const e of shinkSectionEnts){ try{ shinkSrc.entities.remove(e); }catch(_){} }
  shinkSectionEnts=[];
  const parts=[];
  for(const [key,ents] of Object.entries(shinkLineEnts)){
    const v=(st&&st.lines&&st.lines[key])||{ status:'unknown', label:'情報なし', text:'' };
    // 影響区間が経路上に特定できたら本線は緑、区間だけ太線で色付け
    const mapped=[];
    if(shinkLinesData){
      for(const sec of v.sections||[]){
        const path=shinkSectionCoords(ents.raw, ents.name, sec.from, sec.to);
        if(path&&sec.status!=='normal') mapped.push({sec,path});
      }
    }
    const col=Cesium.Color.fromCssColorString(
      mapped.length?SHINK_COLOR.normal:(SHINK_COLOR[v.status]||SHINK_COLOR.unknown));
    for(const {sec,path} of mapped){
      const pts=[]; for(const [lo,la] of path){ pts.push(lo,la,1700); }
      const scol=Cesium.Color.fromCssColorString(SHINK_COLOR[sec.status]||SHINK_COLOR.info);
      const e=shinkSrc.entities.add({ name:`${ents.name} ${sec.from}〜${sec.to}`,
        description:shinkDescHtml(key, `${ents.name} ${sec.from}〜${sec.to}`,
          { ...v, label:SHINK_LBL[sec.status]||sec.status }),
        polyline:{ positions:Cesium.Cartesian3.fromDegreesArrayHeights(pts), width:6.5,
          material:scol, depthFailMaterial:scol.withAlpha(0.6),
          clampToGround:false, arcType:Cesium.ArcType.GEODESIC } });
      shinkSectionEnts.push(e);
      parts.push(`${ents.name.replace('新幹線','')} ${sec.from}〜${sec.to}: ${SHINK_LBL[sec.status]||sec.status}`);
    }
    for(const e of ents.stroke){
      if(e.polyline.material instanceof Cesium.PolylineDashMaterialProperty){
        e.polyline.material=new Cesium.PolylineDashMaterialProperty({ color:col, dashLength:14 });
        e.polyline.depthFailMaterial=new Cesium.PolylineDashMaterialProperty({ color:col.withAlpha(0.55), dashLength:14 });
      } else {
        e.polyline.material=col;
        e.polyline.depthFailMaterial=col.withAlpha(0.55);
      }
      e.description=shinkDescHtml(key, `${ents.name}（${ents.operator}）`, v);
    }
    if(!mapped.length&&v.status!=='normal'&&v.status!=='unknown') parts.push(`${ents.name.replace('新幹線','')}: ${v.label}`);
  }
  // 計画運休・翌日以降の情報(発表がある時だけ凡例内に表示)
  const tmr=document.getElementById('shinkTmr');
  if(tmr){
    const items=(st&&st.tomorrow&&st.tomorrow.items)||[];
    if(items.length){
      tmr.style.display='block';
      tmr.innerHTML='<b style="color:#c9b8ff">📅 計画運休・翌日以降</b><br>'+
        items.map(it=>`<b>${shinkEsc(it.name||'')}</b><br>`+
          `<span style="white-space:pre-line;display:inline-block;max-height:80px;overflow-y:auto">${shinkEsc(it.text||'')}</span>`).join('<br>');
    } else { tmr.style.display='none'; tmr.innerHTML=''; }
  }
  const upd=document.getElementById('upd');
  const ts=st&&st.updated ? st.updated.slice(11,16) : '--:--';
  const tmrN=(st&&st.tomorrow&&st.tomorrow.items||[]).length;
  upd.textContent=`新幹線 運行状況 ${ts}時点 ─ ${parts.length?parts.join(' / '):'全線平常運転'}`+
    (tmrN?`／📅計画運休情報あり(右下)`:'')+
    '・経路 国土数値情報N02-24／運行情報 JR各社(目安・凡例と公式リンクは右下)';
  try{ viewer.scene.requestRender(); }catch(_){}
}
async function loadShinkansen(){
  try{
    const j=await (await fetch('shinkansen_lines.json')).json();
    shinkLinesData=j;
    const src=new Cesium.CustomDataSource('shinkansen');
    const gray=Cesium.Color.fromCssColorString(SHINK_COLOR.unknown);
    shinkLineEnts={};
    for(const [key,ln] of Object.entries(j.lines)){
      const ents={ name:ln.name, operator:ln.operator, stroke:[], raw:ln };
      const mini=ln.type==='mini';
      for(const seg of ln.coords){
        const pts=[]; for(const [lo,la] of seg){ pts.push(lo,la,1500); }
        const pos=Cesium.Cartesian3.fromDegreesArrayHeights(pts);
        // 黒縁(視認性用の下敷き)
        src.entities.add({ polyline:{ positions:pos, width:mini?5:7,
          material:Cesium.Color.BLACK.withAlpha(0.5), clampToGround:false, arcType:Cesium.ArcType.GEODESIC } });
        const e=src.entities.add({ name:ln.name, polyline:{ positions:pos, width:mini?2.5:3.5,
          material:mini?new Cesium.PolylineDashMaterialProperty({ color:gray, dashLength:14 }):gray,
          depthFailMaterial:mini?new Cesium.PolylineDashMaterialProperty({ color:gray.withAlpha(0.55), dashLength:14 }):gray.withAlpha(0.55),
          clampToGround:false, arcType:Cesium.ArcType.GEODESIC } });
        ents.stroke.push(e);
      }
      shinkLineEnts[key]=ents;
    }
    for(const s of j.stations){
      src.entities.add({ position:Cesium.Cartesian3.fromDegrees(s.c[0],s.c[1],1500),
        name:`${s.n}駅（${s.l}）`,
        point:{ pixelSize:4, color:Cesium.Color.fromCssColorString('#cfe5ff'),
          outlineColor:Cesium.Color.BLACK, outlineWidth:1,
          distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0, 1.2e6) },
        label:{ text:s.n, font:'11px sans-serif', fillColor:Cesium.Color.WHITE,
          outlineColor:Cesium.Color.BLACK, outlineWidth:2, style:Cesium.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset:new Cesium.Cartesian2(0,-12),
          distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0, 3.0e5) } });
    }
    shinkSrc=src; viewer.dataSources.add(src);
    document.getElementById('cnt').textContent=Object.keys(j.lines).length+' 路線';
    setErr(null);
    const st=await fetchShinkStatus();
    applyShinkStatus(st);
    if(!st) setErr('運行情報の取得に失敗（経路のみ表示）');
    shinkStTimer=setInterval(async()=>{ const s=await fetchShinkStatus(); if(s) applyShinkStatus(s);
      if(warn3On) refreshWarn3(); }, 5*60*1000);
  }catch(e){ setErr('新幹線データの取得失敗: '+(e&&e.message||e)); }
}

const WARN3_NAME={'33':'大雨特別警報','43':'大雨危険警報','03':'大雨警報','10':'大雨注意報',
 '39':'土砂災害特別警報','49':'土砂災害危険警報','09':'土砂災害警報','29':'土砂災害注意報',
 '38':'高潮特別警報','48':'高潮危険警報','08':'高潮警報','19':'高潮注意報',
 '35':'暴風特別警報','05':'暴風警報','15':'強風注意報','32':'暴風雪特別警報','02':'暴風雪警報','13':'風雪注意報',
 '36':'大雪特別警報','06':'大雪警報','12':'大雪注意報','37':'波浪特別警報','07':'波浪警報','16':'波浪注意報',
 '53':'洪水特別警報','51':'洪水特別警報','41':'洪水危険警報','40':'洪水危険警報','31':'洪水警報','30':'洪水警報',
 '04':'洪水警報','18':'洪水注意報','14':'雷注意報','17':'融雪注意報','20':'濃霧注意報','21':'乾燥注意報',

const WARN3_URLS=[
  { url:'https://api.github.com/repos/earlgrey04/kansai-air-watch/contents/weather_warnings.json?ref=status',

const WARN3_MUNI_HEIGHT=1.2e6;  // カメラ高度がこれ未満なら市町村単位表示
var warn3On=false, warn3Src=null, warn3Data=null, warn3OfficeMax={}, warn3Busy=false;
var warn3CamRemove=null, warn3MuniMode=null;

async function fetchWarn3Data(){
  for(const s of WARN3_URLS){
    try{
      const u=s.bust ? s.url+'?t='+Date.now() : s.url;
      const r=await fetch(u,{ cache:'no-store', ...(s.opts||{}) });

function warn3IsMuni(){
  try{ return viewer.camera.positionCartographic.height < WARN3_MUNI_HEIGHT; }catch(_){ return false; }
}
function restyleWarn3(){
  if(!warn3Src||!warn3Data) return;
  const muni=warn3IsMuni();
  warn3MuniMode=muni;
  for(const e of warn3Src.entities.values){
    if(!e.polygon) continue;
    const p=e.properties;
    const c=p&&p.c&&p.c.getValue(), o=p&&p.o&&p.o.getValue(), n=p&&p.n&&p.n.getValue();
    const m=warn3Data.munis[c];
    const lv=muni ? (m?m.lv:0) : (warn3OfficeMax[o]||0);
    if(!lv){ e.show=false; continue; }
    e.show=true;
    e.polygon.material=Cesium.Color.fromCssColorString(WARN3_COLOR[lv]).withAlpha(0.45);
    e.polygon.outline=false;
    e.name=n||'';
    const names=m ? m.k.map(k=>WARN3_NAME[k]||('コード'+k)).join('・') : '';
    e.description=`<div style="font-size:13px"><b>${n||''}</b><br>`+
      (muni&&names ? `発表中: ${names}` : `管内最大レベル: ${ {20:'注意報',30:'警報',40:'危険警報',50:'特別警報'}[lv]||'' }（ズームで市町村別）`)+
      `<br><span style="color:#889">出典: 気象庁</span></div>`;
  }
  try{ viewer.scene.requestRender(); }catch(_){}
}
function computeWarn3OfficeMax(){
  warn3OfficeMax={};
  if(!warn3Src||!warn3Data) return;
  for(const e of warn3Src.entities.values){
    const p=e.properties;
    if(!p||!p.c) continue;
    const c=p.c.getValue(), o=p.o&&p.o.getValue();
    const m=warn3Data.munis[c];
    if(o&&m&&m.lv>(warn3OfficeMax[o]||0)) warn3OfficeMax[o]=m.lv;
  }
}
async function refreshWarn3(){
  const d=await fetchWarn3Data();
  if(!d) return false;
  warn3Data=d;
  computeWarn3OfficeMax();
  const t=d.reportDatetime ? d.reportDatetime.slice(11,16) : '--:--';
  const note=document.getElementById('shinkWarnNote');
  if(note) note.textContent=`気象庁 ${t}時点・ズームで都道府県⇔市町村・クリックで警報名`;
  restyleWarn3();
  return true;
}
async function toggleShinkWarn(){

async function loadCables(){

      e.polyline.width=1.6;
      e.polyline.material=Cesium.Color.fromCssColorString(col).withAlpha(0.9);
      e.polyline.arcType=Cesium.ArcType.GEODESIC;

    cableSrc=src; viewer.dataSources.add(src);

    for(const e of ls.entities.values){

      if(e.position){ e.point=new Cesium.PointGraphics({ pixelSize:3,
        color:Cesium.Color.fromCssColorString('#ffd34d'), outlineColor:Cesium.Color.BLACK, outlineWidth:0.5,
        distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0, 6.0e6) }); }
    }

// ===== 上空の風（ジェット気流）: Open-Meteo GFS 250hPa を粒子アニメで可視化 =====
// データはCORS *（ブラウザ直取得）。緯度・経度をペアで並べてグリッドを一括取得。
// 全高度(4レベル)を1リクエストでまとめて取得しキャッシュ → 高度切替は再fetchなし＝レート制限(429)回避
async function loadWindGrids(){
  const lat0=-80,lat1=80,lon0=-180,lon1=170,step=10; // 全球10°グリッド（612点）
  const gLat=[],gLon=[];
  for(let la=lat0; la<=lat1; la+=step) gLat.push(la);
  for(let lo=lon0; lo<=lon1; lo+=step) gLon.push(lo);
  const lats=[],lons=[];
  for(const la of gLat) for(const lo of gLon){ lats.push(la); lons.push(lo); }
  const levels=Object.keys(WLV);
  const vars=levels.map(l=>`wind_speed_${l},wind_direction_${l}`).join(',');
  const url=`https://api.open-meteo.com/v1/gfs?latitude=${lats.join(',')}&longitude=${lons.join(',')}`
    +`&hourly=${vars}&wind_speed_unit=ms&forecast_days=1&timeformat=unixtime`;
  const res=await (await fetch(url)).json();
  const arr=Array.isArray(res)?res:[res];
  const nLat=gLat.length, nLon=gLon.length, now=Date.now()/1000;
  const out={};
  for(const lv of levels){
    const U=[],V=[],SP=[];
    for(let i=0;i<nLat;i++){ U.push(new Array(nLon+1)); V.push(new Array(nLon+1)); SP.push(new Array(nLon+1)); }
    for(let k=0;k<arr.length && k<nLat*nLon;k++){
      const h=arr[k].hourly; let ti=0;
      for(let t=0;t<h.time.length;t++){ if(h.time[t]<=now) ti=t; }
      const spd=h[`wind_speed_${lv}`][ti]||0, dir=h[`wind_direction_${lv}`][ti]||0, rad=dir*Math.PI/180;
      const i=Math.floor(k/nLon), j=k%nLon;
      U[i][j]=-spd*Math.sin(rad); V[i][j]=-spd*Math.cos(rad); SP[i][j]=spd; // 気象風向→u(東),v(北) m/s
    }
    for(let i=0;i<nLat;i++){ U[i][nLon]=U[i][0]; V[i][nLon]=V[i][0]; SP[i][nLon]=SP[i][0]; } // 経度ラップ列
    out[lv]={lat0,lon0,step,nLat,nLon:nLon+1,U,V,SP,gLat,gLon:gLon.concat(180)};
  }
  windGridAll=out;
}
function windAt(lon,lat){
  const g=windGrid; if(!g) return null;
  if(lat<g.gLat[0]||lat>g.gLat[g.nLat-1]||lon<g.gLon[0]||lon>g.gLon[g.nLon-1]) return null;
  const fi=(lat-g.lat0)/g.step, fj=(lon-g.lon0)/g.step;
  let i0=Math.max(0,Math.min(g.nLat-2,Math.floor(fi))), j0=Math.max(0,Math.min(g.nLon-2,Math.floor(fj)));
  const di=fi-i0, dj=fj-j0;
  const bl=M=>M[i0][j0]*(1-di)*(1-dj)+M[i0][j0+1]*(1-di)*dj+M[i0+1][j0]*di*(1-dj)+M[i0+1][j0+1]*di*dj;
  return {u:bl(g.U), v:bl(g.V), sp:bl(g.SP)};
}
const _wc=new Cesium.Color();
function windColor(sp,alpha){ // アンバー(遅)→黄→白(速)。各高度の風速スケール(windVmax)で正規化 ※スクラッチ再利用
  const t=Math.max(0,Math.min(1,sp/windVmax));
  _wc.red=1.0; _wc.green=0.72+0.28*t; _wc.blue=0.28+0.67*t; _wc.alpha=alpha; return _wc;
}
function startWind(){
  const cfg=WLV[windLevel]||WLV['250hPa']; windVmax=cfg.vmax;
  const g=windGrid, N=6500, TRAIL=5, MAXAGE=110, ALT=cfg.alt; // 高密度の細かいドット（頭多め・尾短め）
  const K=Math.min(0.03, 0.0065*70/cfg.vmax); // 低層ほど風が弱いので流速を補正（見た目の流れを一定に）
  const loW=g.gLon[0], hiW=g.gLon[g.nLon-1], loA=g.gLat[0], hiA=g.gLat[g.nLat-1];
  windPrim=viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());
  const P=[], scratch=new Cesium.Cartesian3(), talpha=[];
  for(let k=0;k<TRAIL;k++) talpha.push(Math.pow(1-k/TRAIL,1.3)); // 頭=1→尾=薄 の減衰
  const spawn=p=>{ p.lon=loW+Math.random()*(hiW-loW); p.lat=loA+Math.random()*(hiA-loA); p.age=Math.random()*MAXAGE|0;
    for(let k=0;k<TRAIL;k++){ p.hist[k][0]=p.lon; p.hist[k][1]=p.lat; } };
  for(let n=0;n<N;n++){
    const p={pts:[],hist:[],lon:0,lat:0,age:0};
    for(let k=0;k<TRAIL;k++){ p.hist.push([0,0]); p.pts.push(windPrim.add({position:Cesium.Cartesian3.fromDegrees(0,0,ALT),pixelSize:2,color:Cesium.Color.TRANSPARENT})); }
    spawn(p); P.push(p);
  }
  windParticles=P;
  const ticker=()=>{
    if(!windPrim) return;
    for(const p of P){
      const w=windAt(p.lon,p.lat);
      if(!w || w.sp<1.5 || p.age>MAXAGE){ spawn(p); for(const pt of p.pts) pt.color=Cesium.Color.TRANSPARENT; continue; }
      const cs=Math.max(0.25, Math.cos(p.lat*Math.PI/180)); // 極付近の経度暴走を抑制
      p.lon += (w.u*K)/cs; p.lat += w.v*K; p.age++;
      let wrapped=false;
      if(p.lon>180){ p.lon-=360; wrapped=true; } else if(p.lon<-180){ p.lon+=360; wrapped=true; } // 日付変更線ラップ
      if(wrapped){ for(let k=0;k<TRAIL;k++){ p.hist[k][0]=p.lon; p.hist[k][1]=p.lat; } }           // 尾が地球を横断しないよう畳む
      else { for(let k=TRAIL-1;k>0;k--){ p.hist[k][0]=p.hist[k-1][0]; p.hist[k][1]=p.hist[k-1][1]; } // 尾を1つずらす
        p.hist[0][0]=p.lon; p.hist[0][1]=p.lat; }                                                   // 頭＝最新位置
      const fade=Math.min(1, Math.min(p.age, MAXAGE-p.age)/12), spd=w.sp, base=0.55+0.45*Math.min(1,spd/(windVmax*0.62));
      for(let k=0;k<TRAIL;k++){
        Cesium.Cartesian3.fromDegrees(p.hist[k][0],p.hist[k][1],ALT,undefined,scratch);
        const pt=p.pts[k]; pt.position=scratch;
        pt.color=windColor(spd, fade*base*talpha[k]);
        pt.pixelSize=(1.5+2.1*Math.min(1,spd/(windVmax*0.85)))*(1-0.4*k/TRAIL);
      }
    }
  };
  windTickRemove=viewer.clock.onTick.addEventListener(ticker);
}
function setWind(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  weatherOff(); quakesOff(); lightningOff(); volcanoesOff();
  document.querySelectorAll('#bar button').forEach(b=>b.classList.remove('on'));
  satPhoto='esri'; refreshPhotoButtons();               // Esri実写の上に風を重ねる
  const btn=document.getElementById('bWind'); if(btn)btn.classList.add('on');
  setModeLbl('上空の風'); clearStarlink(); setBasemap('dark'); // esri優先で実写ベース／clearNewModes で前回分を掃除
  viewer.clock.shouldAnimate=false;
  viewer.entities.removeAll(); plateVecEnts=[];
  windLevel='250hPa';                                    // 入場時は巡航高度（ジェット気流）から
  viewer.camera.flyTo({ destination:Cesium.Cartesian3.fromDegrees(140,25,2.7e7), duration:1.5 });
  windLevelBar();
  loadAndStartWind();
}
function windLabel(){
  const cfg=WLV[windLevel];
  document.getElementById('cnt').textContent='🌬';
  document.getElementById('upd').textContent=`上空の風（全球・${cfg.ft}／${windLevel}＝${cfg.lbl}）粒子＝気流の流れ・色/太さ＝風速。下の高度ボタンで切替・出典 Open-Meteo GFS`;
}
function windLevelBar(){
  const mb=document.getElementById('modebar'); if(!mb)return; mb.style.display='flex';
  mb.innerHTML=Object.keys(WLV).map(v=>`<button class="${windLevel===v?'on':''}" onclick="setWindLevel('${v}')">${WLV[v].lbl}<span style="opacity:.55;font-size:9px"> ${WLV[v].ft}</span></button>`).join('');
}
function loadAndStartWind(){
  setErr('上空の風（全高度）を取得中…');
  return loadWindGrids().then(()=>{ windGrid=windGridAll[windLevel]; startWind(); windLabel(); windLevelBar(); setErr(null); })
    .catch(e=>setErr('風データの取得失敗: '+(e&&e.message||e)));
}
function stopWindParticles(){
  if(windTickRemove){ try{ windTickRemove(); }catch(_){} windTickRemove=null; }
  if(windPrim){ try{ viewer.scene.primitives.remove(windPrim); }catch(_){} windPrim=null; }
  windParticles=null;
}
function setWindLevel(v){
  if(!WLV[v] || (v===windLevel && windPrim)) return;     // 同じ高度なら何もしない
  windLevel=v; stopWindParticles(); windLevelBar();      // ボタンのon状態を即反映（カメラは動かさない）
  if(windGridAll && windGridAll[v]){ windGrid=windGridAll[v]; startWind(); windLabel(); } // キャッシュから即時（再fetchなし）
  else loadAndStartWind();
}

// ===== 地震の板（1975〜現在 M4+ を深さ×時系列で3D可視化・沈み込むスラブが浮かぶ）=====
// データ: USGS歴史アーカイブをリポジトリ同梱（earthquakes.json）。深さ方向に誇張プロット＋半透明地球で地下を見せる。
const EQ_EXAG=3.0;   // 深さの誇張倍率（沈み込む板を見やすく）
function eqYear(sec){ return new Date(sec*1000).getUTCFullYear(); }
async function loadHistEq(){
  if(!histEqData){
    const j=await (await fetch('earthquakes.json')).json();
    histEqData=j.e; // [ [t(epoch秒),lat,lon,depth_km,mag], ... ] 時系列ソート済み
  }
  histEqPrim=viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());
  histEqPts=[]; histEqColors=[]; histEqSizes=[]; histEqFlash=[];
  for(const [t,lat,lon,dep,mag] of histEqData){
    const pos=Cesium.Cartesian3.fromDegrees(lon,lat,-dep*1000*EQ_EXAG); // 深さ方向（地下）へ
    const col=depthColor(dep); histEqColors.push(col);
    const sz=Math.max(1.3, Math.min(9, (mag-3.6)*1.8)); histEqSizes.push(sz); // 小さめ＝板が見やすい
    const pt=histEqPrim.add({ position:pos, pixelSize:sz, color:Cesium.Color.TRANSPARENT, outlineWidth:0 });
    histEqPts.push(pt);
  }
  histEqT0=histEqData[0][0]; histEqT1=histEqData[histEqData.length-1][0];
}
const EQ_FLASH_MS=450; // 出現スパークの持続時間(ms)＝フレームレート非依存
const _wl=new Cesium.Color();
function histEqNow(){ return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now(); }
function histEqDecayFlash(now){ // 出現直後の点を白→深さ色へフェード（密集域でも新規がわかる）
  if(!histEqFlash.length) return;
  const keep=[];
  for(const fl of histEqFlash){
    if(now-fl.born >= EQ_FLASH_MS){ histEqPts[fl.i].color=histEqColors[fl.i]; } // 期限切れのみ最終色へ（1回だけ書き込む）
    else keep.push(fl); // 点灯中(白)は毎フレーム触らない＝点群バッファの再構築を最小化
  }
  histEqFlash=keep;
}
function histEqRender(flash){ // curT(=histEqT) 以下を可視化（累積・消えない）
  const now=histEqNow();
  while(histEqIdx<histEqData.length && histEqData[histEqIdx][0]<=histEqT){
    if(flash){ histEqPts[histEqIdx].color=Cesium.Color.WHITE; histEqFlash.push({i:histEqIdx,born:now}); } // 出現スパークは色のみ（サイズ変更なし）
    else{ histEqPts[histEqIdx].color=histEqColors[histEqIdx]; }
    histEqIdx++;
  }
  if(flash) histEqDecayFlash(now);
  const yr=eqYear(histEqT);
  const sl=document.getElementById('eqSlider'); if(sl) sl.value=histEqT;
  const lb=document.getElementById('eqYear'); if(lb) lb.textContent=yr+'年';
  const by=document.getElementById('eqBigYear'); if(by) by.textContent=yr;
  document.getElementById('cnt').textContent=histEqIdx.toLocaleString();
}
function histEqSetTime(t,flash){ // スクラブ：巻き戻し時は全消し→再構築
  if(t<histEqT){ for(let i=0;i<histEqIdx;i++){ histEqPts[i].color=Cesium.Color.TRANSPARENT; histEqPts[i].pixelSize=histEqSizes[i]; } histEqIdx=0; histEqFlash=[]; }
  histEqT=t; histEqRender(flash);
}
function histEqStop(){ // 再生停止（rAF/旧setInterval両方を確実に解除）
  histEqPlaying=false; if(histEqRaf){ cancelAnimationFrame(histEqRaf); histEqRaf=null; } if(histEqTimer){ clearInterval(histEqTimer); histEqTimer=null; }
  const b=document.getElementById('eqPlay'); if(b)b.textContent='▶';
}
function histEqPlayPause(){
  if(histEqPlaying){ histEqStop(); return; }
  histEqPlaying=true; const b=document.getElementById('eqPlay'); if(b)b.textContent='⏸';
  if(histEqT>=histEqT1) histEqSetTime(histEqT0,false); // 終端なら頭出し
  const SPAN=histEqT1-histEqT0, STEP=SPAN/600; // 約30秒(50ms×600)。setInterval＝タブ非表示でも進む(rAFは止まる)
  histEqTimer=setInterval(()=>{
    histEqT=Math.min(histEqT1, histEqT+STEP); histEqRender(true);
    try{ viewer.scene.requestRender(); }catch(_){}   // 各tickで明示再描画＝ライブでも描画が止まらない
    if(histEqT>=histEqT1){ histEqStop();
      for(const fl of histEqFlash){ histEqPts[fl.i].color=histEqColors[fl.i]; } histEqFlash=[];
      try{ viewer.scene.requestRender(); }catch(_){} } // 残スパークを最終色へ
  }, 50);
}
function histEqSeek(v){ histEqStop(); histEqSetTime(+v,false); }
async function loadEqCoast(){ // 日本列島の海岸線を浮かせて重ねる（depthFailMaterial＝地球に隠れず常に見える）
  try{ const j=await (await fetch('japan_coast.json')).json();
    const src=new Cesium.CustomDataSource('eqcoast'); const col=Cesium.Color.fromCssColorString('#8fefff');
    for(const seg of j.segs){ const pts=[]; for(const [lo,la] of seg){ pts.push(lo,la,100000); }
      src.entities.add({ polyline:{ positions:Cesium.Cartesian3.fromDegreesArrayHeights(pts), width:2.5,
        material:col, depthFailMaterial:col, arcType:Cesium.ArcType.GEODESIC } }); }
    eqCoastSrc=src; viewer.dataSources.add(src);
  }catch(e){}
}
function setHistEq(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  weatherOff(); quakesOff(); lightningOff(); volcanoesOff();
  document.querySelectorAll('#bar button').forEach(b=>b.classList.remove('on'));
  satPhoto=null; refreshPhotoButtons();
  const btn=document.getElementById('bEqHist'); if(btn)btn.classList.add('on');
  setModeLbl('地震の板'); clearStarlink(); setBasemap('dark'); // clearNewModes 実行
  viewer.clock.shouldAnimate=false;
  viewer.entities.removeAll(); plateVecEnts=[];
  histEqIdx=0; histEqT=0;
  const mb=document.getElementById('modebar'); if(mb)mb.style.display='none';
  setErr('地震の履歴（1975〜）を読み込み中…');
  loadEqCoast();  // 日本列島の海岸線（明るい水色）を重ねて位置がわかるように
  // 日本のスラブ領域を斜め横から見て、沈み込む板（西へ深くなる）が見えるアングル
  viewer.camera.flyToBoundingSphere(
    new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(140,37,-200000*EQ_EXAG), 1.4e6),
    { offset:new Cesium.HeadingPitchRange(Cesium.Math.toRadians(300), Cesium.Math.toRadians(-24), 4.0e6), duration:1.6 });
  loadHistEq().then(()=>{
    viewer.scene.globe.translucency.enabled=true;          // 地球を半透明に→地下の震源が透けて見える
    viewer.scene.globe.translucency.frontFaceAlpha=0.36;
    const mb2=document.getElementById('modebar');
    mb2.innerHTML=`<button id="eqPlay" onclick="histEqPlayPause()">▶</button>`
      +`<input id="eqSlider" type="range" min="${histEqT0}" max="${histEqT1}" value="${histEqT0}" step="86400" oninput="histEqSeek(this.value)" style="width:200px;vertical-align:middle">`
      +`<span id="eqYear" style="margin-left:8px;font-weight:bold">1975年</span>`;
    mb2.style.display='flex';
    { const by=document.getElementById('eqBigYear'); if(by) by.style.display='block'; }
    histEqSetTime(histEqT0,false);
    document.getElementById('upd').textContent='地震の板：1975〜現在 M4+ '+histEqData.length.toLocaleString()+'件を深さ×時系列で。▶で再生すると沈み込む太平洋プレートが板状に浮かぶ・色=深さ(浅赤→深青)/大きさ=規模・出典 USGS';
    setErr(null);
    setTimeout(histEqPlayPause, 600); // 自動再生開始
  }).catch(e=>setErr('地震データの取得失敗: '+(e&&e.message||e)));
}


// カメラをコピー（cキー）＝今の視点コードをクリップボードへ。動画に完全一致で反映できる
window.addEventListener('keydown', function(e){
  if((e.key==='c'||e.key==='C') && !e.ctrlKey && !e.metaKey){
    try{
      const p=viewer.camera.position;
      const code='CAM|'+p.x.toFixed(1)+'|'+p.y.toFixed(1)+'|'+p.z.toFixed(1)+'|'+viewer.camera.heading.toFixed(5)+'|'+viewer.camera.pitch.toFixed(5)+'|'+viewer.camera.roll.toFixed(5);
      if(navigator.clipboard) navigator.clipboard.writeText(code);
      setErr('📋 今のアングルをコピーしました。このコードを貼り付けてください → '+code);
    }catch(err){ setErr('カメラ取得失敗: '+err); }
  }
});

setLive();
</script>
